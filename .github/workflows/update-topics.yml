name: Update Repository Topics

on:
  push:
    branches: [ main ]
    paths:
      - '.github/settings.yml'
  workflow_dispatch:

jobs:
  update-topics:
    runs-on: ubuntu-latest
    # Editing topics needs the "Administration" permission, which GITHUB_TOKEN
    # cannot be granted. Add a fine-grained PAT as the TOPICS_TOKEN secret.
    env:
      TOPICS_TOKEN: ${{ secrets.TOPICS_TOKEN }}
    steps:
      - name: Checkout
        if: env.TOPICS_TOKEN != ''
        uses: actions/checkout@v4

      - name: Update Topics
        if: env.TOPICS_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOPICS_TOKEN }}
          script: |
            // Single source of truth: the topics list in .github/settings.yml
            const fs = require('fs');
            const yml = fs.readFileSync('.github/settings.yml', 'utf8');
            const block = yml.split(/\r?\n  topics:\r?\n/)[1] || '';
            const topics = [];
            for (const line of block.split(/\r?\n/)) {
              const m = line.match(/^\s+-\s+([a-z0-9-]+)\s*$/);
              if (!m) break;
              topics.push(m[1]);
            }
            core.info(`Topics: ${topics.join(', ')}`);

            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: topics
            });

      - name: Skip (no token)
        if: env.TOPICS_TOKEN == ''
        run: echo "::notice::TOPICS_TOKEN secret is not set; skipping topic update."
